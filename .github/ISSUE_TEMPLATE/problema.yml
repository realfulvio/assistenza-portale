name: Problema
description: Qualcosa non funziona come dovrebbe
labels: ["problema"]
body:
  - type: markdown
    attributes:
      value: "Prima di inviare togli dai log indirizzi, nomi, token e dati personali. Per le vulnerabilita' usa SECURITY.md, non questo modulo."
  - type: textarea
    id: descrizione
    attributes:
      label: Cosa succede
      description: Cosa hai fatto, cosa ti aspettavi e cosa e' successo invece.
    validations:
      required: true
  - type: input
    id: versioni
    attributes:
      label: Versioni
      placeholder: "portale 1.0.0, GLPI 11.0.x, Node 20, Debian 13"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (ripuliti)
      description: "Es. sudo journalctl -u portale-assistenza -n 50"
      render: text

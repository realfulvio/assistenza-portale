<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img"><title>Diagramma: il dipendente usa il portale, i tecnici lavorano in GLPI</title><rect width="1200" height="420" fill="#f2f6f9"/><rect x="30" y="52" width="360" height="212" rx="12" fill="white" stroke="#b8cedc"/><text x="50" y="96" fill="#005e8e" font-size="25" font-weight="700" font-family="Arial, sans-serif">DIPENDENTE</text><text x="50" y="150" fill="#001a4d" font-size="27" font-weight="700" font-family="Arial, sans-serif">Usa il portale</text><text x="50" y="197" fill="#426076" font-size="20" font-weight="400" font-family="Arial, sans-serif">Apre e segue la richiesta</text><text x="395" y="165" fill="#005e8e" font-size="27" font-weight="700" font-family="Arial, sans-serif">↔</text><rect x="420" y="52" width="360" height="212" rx="12" fill="white" stroke="#b8cedc"/><text x="440" y="96" fill="#005e8e" font-size="25" font-weight="700" font-family="Arial, sans-serif">PORTALE</text><text x="440" y="150" fill="#001a4d" font-size="27" font-weight="700" font-family="Arial, sans-serif">Collega i due mondi</text><text x="440" y="197" fill="#426076" font-size="20" font-weight="400" font-family="Arial, sans-serif">Invia e legge i ticket via API</text><text x="785" y="165" fill="#005e8e" font-size="27" font-weight="700" font-family="Arial, sans-serif">↔</text><rect x="810" y="52" width="360" height="212" rx="12" fill="white" stroke="#b8cedc"/><text x="830" y="96" fill="#005e8e" font-size="25" font-weight="700" font-family="Arial, sans-serif">TECNICI IN GLPI</text><text x="830" y="150" fill="#001a4d" font-size="27" font-weight="700" font-family="Arial, sans-serif">Gestiscono il ticket</text><text x="830" y="197" fill="#426076" font-size="20" font-weight="400" font-family="Arial, sans-serif">Rispondono, lavorano e risolvono</text><text x="40" y="324" fill="#001a4d" font-size="28" font-weight="700" font-family="Arial, sans-serif">Il dipendente vede nel portale i messaggi pubblici e lo stato.</text><text x="40" y="373" fill="#426076" font-size="24" font-weight="400" font-family="Arial, sans-serif">Le notifiche e-mail sono inviate da GLPI, quando configurate.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="960" viewBox="0 0 600 960" role="img"><title>Ruolo del portale e di GLPI in un diagramma verticale</title><rect width="600" height="960" fill="#f2f6f9"/><rect x="30" y="24" width="540" height="212" rx="12" fill="white" stroke="#b8cedc"/><text x="54" y="69" fill="#005e8e" font-size="29" font-weight="700" font-family="Arial, sans-serif">DIPENDENTE</text><text x="54" y="123" fill="#001a4d" font-size="32" font-weight="700" font-family="Arial, sans-serif">Usa il portale</text><text x="54" y="175" fill="#426076" font-size="26" font-weight="400" font-family="Arial, sans-serif">Apre e segue la richiesta</text><text x="285" y="275" fill="#005e8e" font-size="28" font-weight="700" font-family="Arial, sans-serif">↕</text><rect x="30" y="289" width="540" height="212" rx="12" fill="white" stroke="#b8cedc"/><text x="54" y="334" fill="#005e8e" font-size="29" font-weight="700" font-family="Arial, sans-serif">PORTALE</text><text x="54" y="388" fill="#001a4d" font-size="32" font-weight="700" font-family="Arial, sans-serif">Collega i due mondi</text><text x="54" y="440" fill="#426076" font-size="26" font-weight="400" font-family="Arial, sans-serif">Invia e legge i ticket via API</text><text x="285" y="540" fill="#005e8e" font-size="28" font-weight="700" font-family="Arial, sans-serif">↕</text><rect x="30" y="554" width="540" height="212" rx="12" fill="white" stroke="#b8cedc"/><text x="54" y="599" fill="#005e8e" font-size="29" font-weight="700" font-family="Arial, sans-serif">TECNICI IN GLPI</text><text x="54" y="653" fill="#001a4d" font-size="32" font-weight="700" font-family="Arial, sans-serif">Gestiscono il ticket</text><text x="54" y="705" fill="#426076" font-size="26" font-weight="400" font-family="Arial, sans-serif">Rispondono, lavorano e risolvono</text><text x="30" y="849" fill="#001a4d" font-size="24" font-weight="700" font-family="Arial, sans-serif">Il dipendente vede messaggi pubblici e stato.</text><text x="30" y="898" fill="#426076" font-size="24" font-weight="400" font-family="Arial, sans-serif">GLPI invia le e-mail, quando configurate.</text></svg>